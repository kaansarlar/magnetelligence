name: Import partner logos
on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-partner-logos.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install Pillow cairosvg
      - name: Download remaining logos and update local references
        shell: python
        run: |
          import pathlib, urllib.request, io, hashlib
          import cairosvg
          from PIL import Image
          sources = {
              'hacettepe': ('https://upload.wikimedia.org/wikipedia/commons/2/2c/Hacettepe_%C3%9Cniversitesi_logo.svg', 'd32f8d93bf47d92d58545063f76df21abca170b6', 'https://seekvectors.com/files/download/71a9d79bb508ccc3ba02218b7b903ff6.jpg'),
              'pamukkale': ('https://upload.wikimedia.org/wikipedia/commons/9/9c/Pamukkale_University_logo.svg', '52c5b38790eb3606726bf6d2c73f6c0d8089faea', 'https://upload.wikimedia.org/wikipedia/commons/thumb/9/9c/Pamukkale_University_logo.svg/1024px-Pamukkale_University_logo.svg.png'),
          }
          dst = pathlib.Path('assets/logos')
          dst.mkdir(parents=True, exist_ok=True)
          html = pathlib.Path('index.html')
          content = html.read_text(encoding='utf-8')
          for name, (url, checksum, old) in sources.items():
              req = urllib.request.Request(url, headers={'User-Agent': 'MagnetelligenceLab/1.0 (https://kaansarlar.github.io/magnetelligence/; kagansarlar@kmu.edu.tr)'})
              with urllib.request.urlopen(req, timeout=30) as response:
                  data = response.read(1000001)
              if hashlib.sha1(data).hexdigest() != checksum:
                  raise ValueError('Unexpected SVG checksum: ' + name)
              png = cairosvg.svg2png(bytestring=data, output_width=358 if name=='hacettepe' else 512, output_height=512)
              with Image.open(io.BytesIO(png)) as im:
                  im.load()
                  im.save(dst / (name + '.png'))
              assert 'src="' + old + '"' in content or 'src="assets/logos/' + name + '.png"' in content
              content = content.replace('src="' + old + '"', 'src="assets/logos/' + name + '.png"')
              print('OK',name)
          html.write_text(content, encoding='utf-8')
          assert all((dst / (n+'.png')).is_file() for n in ['akdeniz','bilkent','gurbag','kmu','tubitak','uludag','hacettepe','pamukkale'])
      - name: Commit local logos and HTML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/logos index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Complete local partner logo storage and HTML references"
          git push
